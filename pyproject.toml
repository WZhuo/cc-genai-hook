[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-genai-hook"
version = "0.1.0"
description = "Generic Claude Code GenAI hook: export gen_ai spans to any OTLP HTTP/protobuf backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]

[project.scripts]
cc-genai-hook = "cc_genai_hook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
